name: Cloudflare / CI & Deploy
on:
  push:
    branches: [source]
  pull_request:
    branches: [source]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: eclipse-os-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Build, test & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
  deploy:
    name: Deploy Cloudflare Worker
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/source'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check deployment credentials
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to enable deployment."
          fi
      - name: Deploy Worker and static assets
        if: steps.credentials.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.136.3'
          command: deploy
      - name: Smoke test deployed site
        if: steps.credentials.outputs.ready == 'true'
        env:
          APP_URL: https://eclipse-os.averymiddlebrook2014.workers.dev
        run: |
          set -euo pipefail
          curl -fsSL --retry 6 --retry-all-errors --retry-delay 3 --max-time 25 "$APP_URL/" -o /tmp/eclipse-home.html
          grep -q 'Eclipse OS' /tmp/eclipse-home.html
          curl -fsSL --retry 6 --retry-all-errors --retry-delay 3 --max-time 25 "$APP_URL/api/health" -o /tmp/eclipse-health.json
          curl -fsSL --retry 6 --retry-all-errors --retry-delay 3 --max-time 25 "$APP_URL/api/diagnostics" -o /tmp/eclipse-diagnostics.json
          curl -fsSL --retry 6 --retry-all-errors --retry-delay 3 --max-time 25 "$APP_URL/favicon.svg" -o /tmp/eclipse-favicon.svg
          node --input-type=commonjs -e 'const fs=require("node:fs"); const h=JSON.parse(fs.readFileSync("/tmp/eclipse-health.json","utf8")); const d=JSON.parse(fs.readFileSync("/tmp/eclipse-diagnostics.json","utf8")); if(h.status!=="operational"||h.service!=="eclipse-os"||d.checks?.runtime!==true||d.checks?.securityHeaders!==true)process.exit(1); console.log("Live Cloudflare Worker and diagnostic APIs verified",h.version,h.colo);'
          echo "Production smoke tests passed: $APP_URL"
      - name: Deployment not configured
        if: steps.credentials.outputs.ready != 'true'
        run: echo "Build passed. Deployment skipped until Cloudflare secrets are configured."
